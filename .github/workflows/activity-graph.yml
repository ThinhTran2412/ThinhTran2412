name: Update Profile Graphs & Stats

on:
  schedule:
    # Run twice a day (every 12 hours)
    - cron: "0 */12 * * *"
  push:
    branches:
      - master
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate activity graph SVG
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          # Use the exact same styles as your original graph
          options: theme=react-dark&bg_color=0d1117&color=00ff66&line=00f0ff&point=ff0055&area=true&hide_border=false
          output_path: dist/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate streak stats SVG
        uses: be-next/github-streak-stats-action@v1
        with:
          username: ${{ github.repository_owner }}
          token: ${{ secrets.GITHUB_TOKEN }}
          output-path: dist/streak.svg
          theme: radical
          background: 0d1117
          stroke: 00ff66
          ring: 00f0ff
          fire: ff0055
          currStreakLabel: 00f0ff
          timezone: Asia/Ho_Chi_Minh

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Copy 3D graphs to dist folder
        run: |
          mkdir -p dist
          cp -r profile-3d-contrib/* dist/

      - name: Push SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

